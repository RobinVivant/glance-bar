name: Retry dropped runs

# GitHub sometimes never hands a macOS job to a runner and cancels it after 15 minutes in the
# queue. The run then counts as failed although nothing ran. This starts such a run again, up to
# two times. A run that failed for a real reason is left alone.
on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry:
    name: Re-run a run no runner picked up
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A workflow_run event checks out the default branch, never the code of the run it follows.
      - uses: actions/checkout@v7
      - name: Re-run the run if the queue dropped one of its jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: .github/scripts/retry-dropped.sh
